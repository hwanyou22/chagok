<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="차곡차곡">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>차곡차곡</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#0E6B5B;--acbg:#E3F1EE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;color:#17201D;background:#F4F5F2}
button,input,select{font-family:inherit}
button{cursor:pointer}
#app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:#F4F5F2;position:relative;overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding-bottom:12px}
nav{height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #E1E4DF;display:flex;flex:none}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#5B6661;font-size:11px;font-weight:500}
nav button.on{color:var(--ac);font-weight:700}
h1{margin:0;font-size:20px;font-weight:700}
.title{padding:24px 16px 12px}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 16px 0}
label.l{display:block;font-size:12px;color:#5B6661;margin:10px 0 4px}
.dtf{position:relative;display:flex;align-items:center;justify-content:center;padding:0 12px;margin:0}
.dtf input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;-webkit-appearance:none;appearance:none}
.in{width:100%;height:40px;border:1px solid #D5D9D3;border-radius:10px;padding:0 12px;font-size:14.5px;font-weight:500;color:#17201D;background:#fff}
.in.amt{height:48px;border:2px solid var(--ac);text-align:right;font-size:22px;font-weight:700;padding:0 14px}
.seg{background:#E8EBE6;border-radius:10px;padding:3px;display:flex;gap:2px}
.seg button{flex:1;height:36px;border:0;border-radius:8px;background:transparent;color:#5B6661;font-size:14px;font-weight:500}
.seg button.on{background:#fff;color:#17201D;font-weight:700}
.btn{height:52px;border-radius:14px;border:0;background:var(--ac);color:#fff;font-size:15px;font-weight:700;flex:1}
.btn.o{background:#fff;border:1px solid var(--ac);color:var(--ac);font-size:14px}
.btn.sm{height:44px;border-radius:12px;font-size:14px}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;font-size:12.5px;font-weight:700}
.cell{height:58px;border:0;background:none;border-radius:10px;padding:6px 2px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#17201D;width:100%}
.cell .d{font-size:12px;font-weight:500}
.cell .t{font-size:10.5px;font-weight:500}
.cell.amt{background:#F4F5F2}
.cell.free{background:var(--acbg)}
.cell.free .t{color:var(--ac);font-weight:700}
.cell.miss{border:1px dashed #A9B0A9;padding-top:5px}
.cell.miss .d,.cell.miss .t{color:#5B6661}
.cell.fut .d{color:#5B6661}
.cell.sel{background:#fff;border:2px solid var(--ac);padding-top:4px}
.cell.tod .d{color:var(--ac);font-weight:700}
.cell .inc{font-size:10px;font-weight:700;color:var(--ac)}
.row{display:flex;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#EDEFEB}
.tag.inc{background:var(--acbg);color:var(--ac)}
.tag.sav{background:#ECE7F7;color:#5B3FA0}
.del{height:36px;padding:0 10px;border:0;border-radius:8px;background:#F4F5F2;color:#5B6661;font-size:12px}
.del.sure{background:#FBE9E7;color:#B3261E;font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17201D;color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9;text-align:center}
#toast.show{opacity:.95}
.sw{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:#C9CFC8;border-radius:13px;position:relative;margin:0;transition:background .15s}
.sw:checked{background:var(--ac)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked::after{left:21px}
.err{color:#B3261E}
.chp{height:34px;padding:0 14px;border:1px solid #E1E4DF;border-radius:17px;background:#F4F5F2;color:#17201D;font-size:13px;font-weight:500}
.chp.dim{opacity:.5;text-decoration:line-through}
.chp.add{background:#fff;border:1px dashed var(--ac);color:var(--ac);font-weight:700}
.sec{font-size:14px;font-weight:700}
.dot{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #D5D9D3;padding:0}
.dot.on{box-shadow:0 0 0 3px #17201D}
.pk{display:flex;align-items:center;justify-content:space-between;text-align:left;background:#fff;gap:6px}
.pk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .ph{color:#9AA39E;font-weight:400}
.prow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;border:0;border-top:1px solid #EEF0EC;background:none;font-size:15px;font-weight:500;color:#17201D;text-align:left;padding:0}
.prow.on{font-weight:700;color:var(--ac)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet{animation:up .18s ease-out}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:5}
.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.hint{font-size:11.5px;color:#5B6661}
a{color:var(--ac)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>

<script>
// ===== 구글 클라우드 콘솔에서 만든 클라이언트 ID =====
const CLIENT_ID = '1042667484761-6m5sr908f13n6ph13g63mujmkls8jhve.apps.googleusercontent.com';
// ====================================================
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const SHEET_NAME = '차곡차곡';
const TABS = {
  '거래': ['날짜','시각','구분','금액','대분류','소분류','내용','결제수단','비고','번호','총액','정산대기'],
  '정산': ['번호','이름','받을 금액','받은 금액','받은 날짜'],
  '무지출일': ['날짜'],
  '설정': ['종류','이름','값1','값2','값3'],
  '기억': ['종류','키','값1','값2']
};
const K = { theme:'chagok.theme', id:'chagok.sheetId', tok:'chagok.token', wel:'chagok.welcomeDate', weloff:'chagok.welcomeOff' };
const DOW = ['일','월','화','수','목','금','토'];
const KINDS = ['지출','수입','저축'];

// ---------- 작은 도구 ----------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const pad = n => String(n).padStart(2, '0');
const dstr = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);
const todayStr = () => { const d = new Date(); return dstr(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); const t = new Date(y, m - 1, d + n); return dstr(t.getFullYear(), t.getMonth() + 1, t.getDate()); };
const fmt = n => Number(n).toLocaleString('en-US');
const dateLabel = d => { const a = d.split('-'); return a[0] + '. ' + Number(a[1]) + '. ' + Number(a[2]) + '. (' + DOW[dowOf(d)] + ')'; };
const short = n => n >= 1000000 ? Math.round(n / 10000) + '만' : fmt(n);
const dowOf = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
function norm(v) {
  if (typeof v === 'number' && v > 20000) { const d = new Date(Date.UTC(1899, 11, 30) + v * 864e5); return dstr(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
  const m = String(v || '').trim().match(/^(\d{4})[-./ ]+(\d{1,2})[-./ ]+(\d{1,2})/);
  return m ? dstr(+m[1], +m[2], +m[3]) : '';
}
let toastTimer;
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.style.background = err ? '#B3261E' : '#17201D'; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------- 상태 ----------
const t0 = todayStr();
const S = {
  view: 'welcome', wvar: 'normal', wmsg: '', busy: false,
  y: +t0.slice(0, 4), m: +t0.slice(5, 7), sel: t0,
  sheetId: lsGet(K.id), gids: {}, tx: [], free: {}, opts: {}, optRow: {},
  form: null, confirm: '', pays: [], cats: [], subs: [], modal: null, picker: null, seg: '변동비'
};
function newForm(date) { return { kind: '지출', date: date || todayStr(), amt: '', memo: '', pay: '', cat: '', sub: '', note: '' }; }

// ---------- 구글 로그인 ----------
let token = null, tokenExp = 0, tokenClient = null, pendingRes = null, pendingRej = null, gisReady = null;
(function loadSaved() {
  try { const o = JSON.parse(lsGet(K.tok) || 'null'); if (o && o.exp > Date.now()) { token = o.t; tokenExp = o.exp; } } catch (e) {}
})();
const tokenValid = () => !!token && Date.now() < tokenExp;
function loadGis() {
  if (gisReady) return gisReady;
  gisReady = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client';
    s.onload = () => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, scope: SCOPE,
        callback: r => {
          if (r && r.access_token) {
            token = r.access_token; tokenExp = Date.now() + (Number(r.expires_in || 3600) - 120) * 1000;
            lsSet(K.tok, JSON.stringify({ t: token, exp: tokenExp }));
            if (pendingRes) pendingRes(token);
          } else if (pendingRej) pendingRej(new Error((r && r.error) || '로그인에 실패했어요'));
          pendingRes = pendingRej = null;
        },
        error_callback: e => { if (pendingRej) pendingRej(new Error(e && e.type === 'popup_closed' ? '로그인 창이 닫혔어요' : '로그인 창을 열 수 없어요')); pendingRes = pendingRej = null; }
      });
      res();
    };
    s.onerror = () => { gisReady = null; rej(new Error('구글 로그인 스크립트를 불러오지 못했어요. 인터넷을 확인해 주세요.')); };
    document.head.appendChild(s);
  });
  return gisReady;
}
// 버튼을 누른 직후에 불러야 팝업이 막히지 않아요
function getToken(consent) {
  if (!consent && tokenValid()) return Promise.resolve(token);
  if (!tokenClient) return Promise.reject(new Error('로그인 준비 중이에요. 잠시 뒤 다시 눌러 주세요.'));
  return new Promise((res, rej) => { pendingRes = res; pendingRej = rej; tokenClient.requestAccessToken({ prompt: consent ? 'consent' : '' }); });
}
async function api(url, opts = {}, retry = true) {
  if (!tokenValid()) throw Object.assign(new Error('연결이 만료됐어요'), { expired: true });
  const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, opts.headers || {}) }));
  if (r.status === 401) { token = null; lsDel(K.tok); throw Object.assign(new Error('연결이 만료됐어요'), { expired: true }); }
  if (!r.ok) { let m = ''; try { m = (await r.json()).error.message; } catch (e) {} throw new Error(r.status + ' ' + m); }
  return r.json();
}
const SH = 'https://sheets.googleapis.com/v4/spreadsheets';
const enc = encodeURIComponent;

// ---------- 시트 ----------
async function findSheet() {
  const saved = lsGet(K.id);
  if (saved) { try { await api(SH + '/' + saved + '?fields=spreadsheetId'); return saved; } catch (e) { if (e.expired) throw e; } }
  const q = enc("name='" + SHEET_NAME + "' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
  const j = await api('https://www.googleapis.com/drive/v3/files?q=' + q + '&orderBy=createdTime&fields=files(id,name)');
  return j.files && j.files.length ? j.files[0].id : null;
}
async function createSheet() {
  const names = Object.keys(TABS);
  const j = await api(SH, { method: 'POST', body: JSON.stringify({ properties: { title: SHEET_NAME, locale: 'ko_KR' }, sheets: names.map(n => ({ properties: { title: n, gridProperties: { frozenRowCount: 1 } } })) }) });
  await api(SH + '/' + j.spreadsheetId + '/values:batchUpdate', { method: 'POST', body: JSON.stringify({ valueInputOption: 'RAW', data: names.map(n => ({ range: n + '!A1', values: [TABS[n]] })) }) });
  return j.spreadsheetId;
}
async function loadGids() {
  const j = await api(SH + '/' + S.sheetId + '?fields=sheets.properties(sheetId,title)');
  S.gids = {}; (j.sheets || []).forEach(s => { S.gids[s.properties.title] = s.properties.sheetId; });
}
async function reload() {
  const qs = ['거래!A2:L', '무지출일!A2:A', '설정!A2:E'].map(r => 'ranges=' + enc(r)).join('&');
  const j = await api(SH + '/' + S.sheetId + '/values:batchGet?valueRenderOption=UNFORMATTED_VALUE&' + qs);
  const v = j.valueRanges || [];
  S.tx = ((v[0] && v[0].values) || []).map((r, i) => ({
    row: i + 2, date: norm(r[0]), time: r[1] || '', kind: r[2] || '', amt: Number(r[3]) || 0, cat: r[4] || '', sub: r[5] || '',
    memo: r[6] || '', pay: r[7] || '', note: r[8] || '', pending: r[11] !== undefined && String(r[11]).trim() !== ''
  })).filter(t => t.date);
  S.free = {}; ((v[1] && v[1].values) || []).forEach((r, i) => { const d = norm(r[0]); if (d) S.free[d] = i + 2; });
  S.opts = {}; S.optRow = {}; S.pays = []; S.cats = []; S.subs = [];
  const on = x => x === '1' || x === 1 || x === true;
  ((v[2] && v[2].values) || []).forEach((r, i) => {
    const row = i + 2, t = r[0], n = r[1] == null ? '' : String(r[1]);
    if (!n) return;
    if (t === '옵션') { S.opts[n] = r[2]; S.optRow[n] = row; }
    else if (t === '결제수단') S.pays.push({ row, name: n, hidden: on(r[2]) });
    else if (t === '대분류') S.cats.push({ row, name: n, kind: r[2] || '지출', fv: r[3] || '', hidden: on(r[4]) });
    else if (t === '소분류') S.subs.push({ row, name: n, parent: String(r[2] || ''), hidden: on(r[3]) });
  });
}
async function connect() {
  if (S.busy) return; S.busy = true; S.wmsg = ''; render();
  try {
    // 팝업이 막히지 않게, 스크립트가 이미 준비됐으면 바로 로그인 창을 열어요
    await (tokenClient ? getToken(!S.sheetId) : loadGis().then(() => getToken(!S.sheetId)));
    let id = await findSheet(); if (!id) id = await createSheet();
    S.sheetId = id; lsSet(K.id, id);
    await loadGids(); await reload();
    lsSet(K.wel, todayStr()); S.view = 'home';
  } catch (e) { S.wmsg = e.message; if (e.expired) S.wvar = 'reconnect'; }
  S.busy = false; render();
}
async function enterSilently() {
  try { await loadGis().catch(() => {}); if (!S.sheetId) throw Object.assign(new Error('x'), { expired: true }); await loadGids(); await reload(); S.view = 'home'; }
  catch (e) { S.view = 'welcome'; S.wvar = 'reconnect'; S.wmsg = e.expired ? '' : e.message; }
  render();
}
function onExpired() { S.view = 'welcome'; S.wvar = 'reconnect'; S.wmsg = ''; render(); }
async function run(fn, okMsg) {
  if (S.busy) return false; S.busy = true;
  try { await fn(); if (okMsg) toast(okMsg); S.busy = false; return true; }
  catch (e) { S.busy = false; if (e.expired) onExpired(); else toast(e.message, true); return false; }
}
async function appendRows(tab, rows) {
  await api(SH + '/' + S.sheetId + '/values/' + enc(tab + '!A:L') + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', { method: 'POST', body: JSON.stringify({ values: rows }) });
}
async function deleteRows(tab, rows) {
  const reqs = rows.slice().sort((a, b) => b - a).map(r => ({ deleteDimension: { range: { sheetId: S.gids[tab], dimension: 'ROWS', startIndex: r - 1, endIndex: r } } }));
  await api(SH + '/' + S.sheetId + ':batchUpdate', { method: 'POST', body: JSON.stringify({ requests: reqs }) });
}
async function setOption(name, val) {
  if (S.optRow[name]) await api(SH + '/' + S.sheetId + '/values/' + enc('설정!A' + S.optRow[name] + ':C' + S.optRow[name]) + '?valueInputOption=RAW', { method: 'PUT', body: JSON.stringify({ values: [['옵션', name, val]] }) });
  else await appendRows('설정', [['옵션', name, val]]);
  await reload();
}

async function putRow(row, vals) {
  await api(SH + '/' + S.sheetId + '/values/' + enc('설정!A' + row + ':E' + row) + '?valueInputOption=RAW', { method: 'PUT', body: JSON.stringify({ values: [vals] }) });
}
async function patchCells(data) {
  if (!data.length) return;
  await api(SH + '/' + S.sheetId + '/values:batchUpdate', { method: 'POST', body: JSON.stringify({ valueInputOption: 'RAW', data }) });
}
const payRow = (n, h) => ['결제수단', n, h ? '1' : '', '', ''];
const catRow = (n, kind, fv, h) => ['대분류', n, kind, fv || '', h ? '1' : ''];
const subRow = (n, parent, h) => ['소분류', n, parent, h ? '1' : '', ''];
const SEED = [
  ['지출', '변동', '식비', ['식자재', '배달', '간식', '외식']], ['지출', '변동', '교통', ['대중교통', '택시', '주유']], ['지출', '변동', '생활', ['생필품', '의류', '미용']],
  ['지출', '변동', '문화·여가', ['영화', '여행', '취미']], ['지출', '변동', '의료·건강', ['병원', '약']], ['지출', '변동', '경조사', ['축의금', '조의금', '선물']],
  ['지출', '고정', '주거', ['월세', '관리비']], ['지출', '고정', '통신', ['휴대폰', '인터넷']], ['지출', '고정', '보험', ['건강보험', '실손']], ['지출', '고정', '대출', ['이자']], ['지출', '고정', '구독', ['구독']],
  ['수입', '', '급여', ['월급']], ['수입', '', '용돈', ['용돈']], ['수입', '', '기타 수입', ['기타']],
  ['저축', '', '저축', ['적금', '예금', '청약']]
];
async function seedCats() {
  const rows = [];
  SEED.forEach(c => { rows.push(catRow(c[2], c[0], c[1], false)); c[3].forEach(n => rows.push(subRow(n, c[2], false))); });
  await appendRows('설정', rows); await reload();
}
async function saveModal() {
  const M = S.modal, name = M.name.trim();
  if (!name) return toast('이름을 넣어 주세요', true);
  const same = x => x.row !== M.row && x.name === name;
  const dup = M.type === 'pay' ? S.pays.some(same) : M.type === 'cat' ? S.cats.some(same) : S.subs.some(x => same(x) && x.parent === M.parent);
  if (dup) return toast('같은 이름이 이미 있어요', true);

function inSeg(c, seg) { return seg === '수입' ? c.kind === '수입' : seg === '저축' ? c.kind === '저축' : c.kind === '지출' && (seg === '고정비' ? c.fv === '고정' : c.fv !== '고정'); }
function modalHtml() {
  const M = S.modal; if (!M) return '';
  const T = { pay: '결제수단', cat: '대분류', sub: '소분류' }[M.type];
  return '<div class="modal" data-act="mclose"><div class="sheet" data-act="noop" role="dialog" aria-label="' + T + '">' +
    '<div style="font-size:16px;font-weight:700">' + T + (M.row ? ' 고치기' : ' 추가') + (M.type === 'sub' ? ' · ' + esc(M.parent) : '') + '</div>' +
    '<label class="l" for="m-name">이름</label><input id="m-name" class="in" type="text" value="' + esc(M.name) + '" autocomplete="off">' +
    (M.row ? '<div class="hint" style="margin-top:8px">이름을 바꾸면 지난 기록의 이름도 같이 바뀌어요. 지우는 대신 숨기면 기록은 그대로 남아요.</div>' : '') +
    '<div class="row" style="margin-top:16px">' + (M.row ? '<button class="btn o" data-act="mhide" style="flex:1">' + (M.hidden ? '다시 보이기' : '숨기기') + '</button>' : '<button class="btn o" data-act="mclose" style="flex:1">취소</button>') +
    '<button class="btn" data-act="msave" style="flex:1">저장</button></div></div></div>';
}
function settingsHtml() {
  const url = 'https://docs.google.com/spreadsheets/d/' + S.sheetId;
  const chips = (arr, act, extra) => arr.map(x => '<button class="chp' + (x.hidden ? ' dim' : '') + '" data-act="' + act + '" data-row="' + x.row + '">' + esc(x.name) + '</button>').join('');
  const cats = S.cats.filter(c => inSeg(c, S.seg));
  const catCards = cats.map(c => '<div style="border-top:1px solid #EEF0EC;padding:10px 0 4px">' +
    '<div class="row" style="justify-content:space-between;margin-bottom:8px"><button data-act="ecat" data-row="' + c.row + '" style="border:0;background:none;padding:0;font-size:14px;font-weight:700;color:' + (c.hidden ? '#9AA39E' : '#17201D') + ';text-decoration:' + (c.hidden ? 'line-through' : 'none') + '">' + esc(c.name) + ' ›</button>' +
    (c.kind === '지출' ? '<select class="in" style="width:96px;height:36px;font-size:13px;padding:0 8px" data-act="fv" data-row="' + c.row + '" aria-label="고정비 변동비"><option' + (c.fv !== '고정' ? ' selected' : '') + '>변동비</option><option' + (c.fv === '고정' ? ' selected' : '') + '>고정비</option></select>' : '') + '</div>' +
    '<div class="row" style="flex-wrap:wrap;gap:6px">' + chips(S.subs.filter(x => x.parent === c.name), 'esub') + '<button class="chp add" data-act="nsub" data-p="' + esc(c.name) + '">+</button></div></div>').join('');
  return '<div class="scroll"><div class="title"><h1><span aria-hidden="true">🛠️</span> 사부작 사부작 세팅하기</h1></div>' +
    '<div class="card" style="margin-top:0"><div class="row" style="justify-content:space-between"><div><div class="hint">연결된 구글 시트</div><div style="font-size:14px;font-weight:500">차곡차곡 · 내 구글 드라이브</div></div>' +
    '<a href="' + url + '" target="_blank" rel="noopener" style="height:36px;padding:0 14px;border-radius:18px;background:var(--acbg);color:var(--ac);font-size:13px;font-weight:700;display:inline-flex;align-items:center;text-decoration:none">시트 열기</a></div>' +
    '<div style="border-top:1px solid #EEF0EC;margin-top:10px;padding-top:10px" class="row"><div style="flex:1"><div style="font-size:14px">기록 시작 월</div><div class="hint">이전 달은 숨겨질 뿐 지워지지 않아요</div></div>' +
    '<input type="month" class="in" style="width:150px" value="' + startMonth() + '" data-act="startm" aria-label="기록 시작 월"></div></div>' +
    '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="sec">결제수단</div><div class="hint">눌러서 이름 고치기·숨기기</div></div>' +
    '<div class="row" style="flex-wrap:wrap;gap:6px">' + chips(S.pays, 'epay') + '<button class="chp add" data-act="npay">+ 추가</button></div>' +
    (S.pays.length ? '' : '<div class="hint" style="margin-top:8px">예: 현금, 국민카드, 카카오뱅크</div>') + '</div>' +
    '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="sec">분류</div><div class="hint">고정비·변동비는 대분류 단위</div></div>' +
    '<div class="seg">' + SEGS.map(g => '<button data-act="seg" data-g="' + g + '" class="' + (S.seg === g ? 'on' : '') + '">' + g + '</button>').join('') + '</div>' +
    '<div style="margin-top:8px">' + (cats.length ? catCards : '<div class="hint" style="padding:10px 0">' + (S.cats.length ? '이 보기에는 아직 대분류가 없어요' : '아직 분류가 없어요') + '</div>') + '</div>' +
    '<button class="chp add" data-act="ncat" style="width:100%;height:40px;margin-top:8px">+ 대분류 추가</button>' +
    (S.cats.length ? '' : '<button class="btn sm o" data-act="seed" style="width:100%;margin-top:8px">기본 분류 한꺼번에 넣기</button><div class="hint" style="margin-top:6px">식비·교통·주거·급여·저축(적금·예금·청약) 등 흔한 분류를 넣어요. 나중에 고치거나 숨길 수 있어요</div>') + '</div>' +
    '<div class="card"><div class="row" style="justify-content:space-between"><div class="sec">테마 색</div><div class="row" style="gap:12px">' +
    Object.keys(THEMES).map(k => '<button class="dot' + ((lsGet(K.theme) || 'green') === k ? ' on' : '') + '" data-act="theme" data-t="' + k + '" style="background:' + THEMES[k][0] + '" aria-label="' + THEMES[k][2] + '"></button>').join('') + '</div></div>' +
    '<div class="hint" style="margin-top:8px">버튼과 선택된 탭 같은 포인트 색만 바뀌어요 · 이 기기에만 저장돼요</div></div>' +
    '<div class="card"><label class="row" style="min-height:48px;justify-content:space-between"><span><span style="font-size:14px">열 때 입장 화면 보이기</span><span class="hint" style="display:block">하루 첫 실행에서만 나와요 · 이 기기에만 저장돼요</span></span>' +
    '<input type="checkbox" class="sw" data-act="weloff"' + (lsGet(K.weloff) === '1' ? '' : ' checked') + '></label></div>' +
    '<div class="card"><button class="btn sm o" data-act="disconnect" style="width:100%">이 기기에서 연결 해제</button><div class="hint" style="margin-top:8px">시트와 기록은 그대로 남아요. 다시 입장하면 같은 시트에 연결돼요.</div></div></div>' + navHtml() + modalHtml();
}
function render() {
  const app = $('app'), v = S.view;
  const active = document.activeElement && document.activeElement.id;
  app.innerHTML = v === 'welcome' ? welcomeHtml() : v === 'home' ? homeHtml() : v === 'input' ? inputHtml() : v === 'stats' ? statsHtml() : settingsHtml();
  if (active && $(active) && /^f-/.test(active)) { const el = $(active); el.focus(); try { const l = el.value.length; el.setSelectionRange(l, l); } catch (e) {} }
}

// ---------- 동작 ----------
function openModal(m) { S.modal = Object.assign({ hidden: false }, m); render(); const n = $('m-name'); if (n) { n.focus(); } }
function go(v) { S.view = v; S.confirm = ''; S.picker = null; if (v === 'input' && !S.form) S.form = newForm(S.sel); render(); }
async function saveTx(cont) {
  const f = S.form, amt = Number(String(f.amt).replace(/[^0-9]/g, ''));
  if (!amt) return toast('금액을 넣어 주세요', true);
  if (!f.date) return toast('날짜를 골라 주세요', true);
  const date = f.date, time = date === todayStr() ? (pad(new Date().getHours()) + ':' + pad(new Date().getMinutes())) : '';
  const ok = await run(async () => {
    await appendRows('거래', [[date, time, f.kind, amt, f.cat.trim(), f.sub.trim(), f.memo.trim(), (f.kind === '수입' ? '' : f.pay.trim()), f.note.trim(), '', '', '']]);
    if (f.kind === '지출' && S.free[date]) { await deleteRows('무지출일', [S.free[date]]); }
    await reload();
  }, '저장했어요');
  if (!ok) { render(); return; }
  S.y = +date.slice(0, 4); S.m = +date.slice(5, 7); S.sel = date;
  if (cont) { S.form = Object.assign(newForm(date), { kind: f.kind, pay: f.pay }); render(); const a = $('f-amt'); if (a) a.focus(); }
  else { S.form = null; go('home'); }
}
const actions = {
  pk: el => {
    const f = el.dataset.f;
    if (f === 'sub' && !S.form.cat) return toast('대분류를 먼저 골라 주세요');
    S.picker = { f, title: f === 'pay' ? (S.form.kind === '저축' ? '출금 계좌' : '결제수단') : f === 'cat' ? '대분류' : '소분류', opts: pickOpts(f) }; render();
  },
  pv: el => {
    const P = S.picker, i = Number(el.dataset.i), cur = S.form[P.f], list = P.opts.slice(); if (cur && list.indexOf(cur) < 0) list.push(cur);
    S.form[P.f] = i < 0 ? '' : list[i]; if (P.f === 'cat') S.form.sub = ''; S.picker = null; render();
  },
  pclose: () => { S.picker = null; render(); },
  topset: () => { S.picker = null; go('settings'); },
  noop: () => {},
  seg: el => { S.seg = el.dataset.g; render(); },
  theme: el => { lsSet(K.theme, el.dataset.t); applyTheme(); render(); },
  seed: async () => { await run(seedCats, '기본 분류를 넣었어요'); render(); },
  npay: () => openModal({ type: 'pay', name: '' }),
  epay: el => { const x = S.pays.find(p => p.row === Number(el.dataset.row)); openModal({ type: 'pay', row: x.row, name: x.name, orig: x.name, hidden: x.hidden }); },
  ncat: () => openModal({ type: 'cat', name: '', kind: S.seg === '수입' ? '수입' : S.seg === '저축' ? '저축' : '지출', fv: S.seg === '고정비' ? '고정' : S.seg === '변동비' ? '변동' : '' }),
  ecat: el => { const x = S.cats.find(p => p.row === Number(el.dataset.row)); openModal({ type: 'cat', row: x.row, name: x.name, orig: x.name, kind: x.kind, fv: x.fv, hidden: x.hidden }); },
  nsub: el => openModal({ type: 'sub', name: '', parent: el.dataset.p }),
  esub: el => { const x = S.subs.find(p => p.row === Number(el.dataset.row)); openModal({ type: 'sub', row: x.row, name: x.name, orig: x.name, parent: x.parent, hidden: x.hidden }); },
  mclose: () => { S.modal = null; render(); },
  msave: () => saveModal(),
  mhide: () => { S.modal.hidden = !S.modal.hidden; saveModal(); },
  connect: () => connect(),
  nav: el => go(el.dataset.v),
  mon: el => { let m = S.m + Number(el.dataset.n), y = S.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } S.y = y; S.m = m; S.confirm = ''; render(); },
  today: () => { const t = todayStr(); S.y = +t.slice(0, 4); S.m = +t.slice(5, 7); S.sel = t; render(); },
  pick: el => { S.sel = el.dataset.d; S.confirm = ''; render(); },
  add: () => { S.form = newForm(S.sel); go('input'); },
  free: async () => {
    const d = S.sel;
    await run(async () => { if (S.free[d]) await deleteRows('무지출일', [S.free[d]]); else await appendRows('무지출일', [[d]]); await reload(); });
    render();
  },
  close: async () => {
    const today = todayStr(), start = startMonth(), ag = monthAgg(S.y, S.m), days = new Date(S.y, S.m, 0).getDate(), miss = [];
    for (let d = 1; d <= days; d++) { const ds = dstr(S.y, S.m, d); if (dayState(ds, ag, today, start) === 'miss') miss.push([ds]); }
    if (!miss.length) { toast('미입력 날짜가 없어요'); return; }
    if (S.confirm !== 'close') { S.confirm = 'close'; render(); setTimeout(() => { if (S.confirm === 'close') { S.confirm = ''; render(); } }, 3500); return; }
    S.confirm = '';
    await run(async () => { await appendRows('무지출일', miss); await reload(); }, miss.length + '일을 무지출로 표시했어요');
    render();
  },
  del: async el => {
    const row = Number(el.dataset.row), key = 'del' + row;
    if (S.confirm !== key) { S.confirm = key; render(); setTimeout(() => { if (S.confirm === key) { S.confirm = ''; render(); } }, 3000); return; }
    S.confirm = '';
    await run(async () => { await deleteRows('거래', [row]); await reload(); }, '삭제했어요');
    render();
  },
  kind: el => { S.form.kind = el.dataset.k; S.form.cat = ''; S.form.sub = ''; S.picker = null; render(); },
  dset: el => { S.form.date = addDays(todayStr(), Number(el.dataset.n)); render(); },
  save: el => saveTx(!!el.dataset.cont),
  disconnect: () => { [K.id, K.tok, K.wel].forEach(lsDel); token = null; S.sheetId = null; S.tx = []; S.free = {}; S.opts = {}; S.form = null; S.view = 'welcome'; S.wvar = 'normal'; S.wmsg = ''; render(); },
  weloff: el => { if (el.checked) lsDel(K.weloff); else lsSet(K.weloff, '1'); toast(el.checked ? '입장 화면을 보여 드릴게요' : '입장 화면을 건너뛸게요'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  const fn = actions[el.dataset.act]; if (fn && !el.disabled) fn(el);
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.act === 'weloff') actions.weloff(el);
  if (el.dataset.act === 'startm' && el.value) { await run(() => setOption('기록 시작 월', el.value), '시작 월을 바꿨어요'); render(); }
  if (el.dataset.f === 'date' && el.value) { S.form.date = el.value; render(); }
  if (el.tagName === 'SELECT' && el.dataset.f && S.form) { S.form[el.dataset.f] = el.value; if (el.dataset.f === 'cat') S.form.sub = ''; render(); }
  if (el.dataset.act === 'fv') {
    const c = S.cats.find(x => x.row === Number(el.dataset.row)); const fv = el.value === '고정비' ? '고정' : '변동';
    await run(async () => { await putRow(c.row, catRow(c.name, c.kind, fv, c.hidden)); await reload(); }, '바꿨어요'); render();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'm-name' && S.modal) { S.modal.name = el.value; return; }
  const f = el.dataset && el.dataset.f; if (!f || !S.form || el.tagName === 'SELECT') return;
  if (f === 'amt') { const n = el.value.replace(/[^0-9]/g, ''); S.form.amt = n ? fmt(Number(n)) : ''; el.value = S.form.amt; }
  else S.form[f] = el.value;
});

// ---------- 시작 ----------
applyTheme();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
(function boot() {
  const today = todayStr(), shownToday = lsGet(K.wel) === today, wantWelcome = lsGet(K.weloff) !== '1';
  if (S.sheetId && tokenValid() && (shownToday || !wantWelcome)) { S.view = 'welcome'; S.wvar = 'normal'; render(); enterSilently(); return; }
  S.view = 'welcome'; S.wvar = (S.sheetId && (shownToday || !wantWelcome)) ? 'reconnect' : 'normal';
  render(); loadGis().catch(e => { S.wmsg = e.message; render(); });
})();
</script>
</body>
</html>
